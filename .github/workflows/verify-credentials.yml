name: Verify credentials

# Proves all three stored secrets work, on GitHub's servers. A local check
# proves nothing about what is stored: see the 2026-11-15 log entry.
# Read-only. Prints no secret values.

on: workflow_dispatch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://slack.com/api/auth.test",
              headers={"Authorization": "Bearer " + os.environ["SLACK_BOT_TOKEN"]})
          d = json.load(urllib.request.urlopen(req))
          print("slack auth.test ok:", d.get("ok"), "| team:", d.get("team"), "| error:", d.get("error"))
          assert d.get("ok")
          PY

      - name: HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://api.hubapi.com/crm/v3/objects/contacts?limit=1&properties=email",
              headers={"Authorization": "Bearer " + os.environ["HUBSPOT_TOKEN"]})
          try:
              d = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              raise SystemExit("hubspot rejected the token: %s %s" % (e.code, e.read()[:300]))
          print("hubspot contacts read ok, rows returned:", len(d.get("results", [])))
          PY

      - name: Google Sheets
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          pip install --quiet google-auth google-auth-httplib2 google-api-python-client
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          info = json.loads(os.environ["GOOGLE_SA_JSON"])
          print("service account:", info["client_email"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/spreadsheets"])
          svc = build("sheets", "v4", credentials=creds, cache_discovery=False)
          SHEET = "1-EM01DJqlgs81bvGDj6v_wifJLb5t_oxkGlTabvmwRI"
          r = svc.spreadsheets().values().get(
              spreadsheetId=SHEET, range="Untitled!A1:M1").execute()
          print("header row read:", r.get("values"))
          grid = svc.spreadsheets().get(spreadsheetId=SHEET,
              fields="sheets.properties.title,sheets.properties.gridProperties.rowCount").execute()
          print("sheet:", grid["sheets"][0]["properties"])
          PY
