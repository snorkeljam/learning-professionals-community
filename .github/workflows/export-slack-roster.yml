name: Export Slack roster

# One-off diagnostic: dumps the workspace roster as a build artifact so a session
# can join it against HubSpot by email. The Slack connector searches names only,
# so this is the only way to get emails out of the workspace.
# Private repo, one day retention. Not scheduled.

on: workflow_dispatch

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the roster
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse

          tok = os.environ["SLACK_BOT_TOKEN"]

          def call(method, **q):
              url = "https://slack.com/api/" + method
              if q:
                  url += "?" + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              return json.load(urllib.request.urlopen(req))

          cur, people = None, []
          while True:
              q = {"limit": 200}
              if cur:
                  q["cursor"] = cur
              d = call("users.list", **q)
              if not d.get("ok"):
                  sys.exit("users.list failed: %s" % d.get("error"))
              for u in d["members"]:
                  if u.get("is_bot") or u.get("deleted") or u.get("id") == "USLACKBOT":
                      continue
                  if u.get("is_restricted") or u.get("is_ultra_restricted"):
                      continue
                  p = u.get("profile", {})
                  people.append({
                      "id": u.get("id"),
                      "name": u.get("name"),
                      "real_name": p.get("real_name") or u.get("real_name") or "",
                      "display_name": p.get("display_name") or "",
                      "email": p.get("email") or "",
                      "title": p.get("title") or "",
                      "updated": u.get("updated"),
                  })
              cur = d.get("response_metadata", {}).get("next_cursor")
              if not cur:
                  break

          people.sort(key=lambda p: p["updated"] or 0, reverse=True)
          with open("roster.json", "w", encoding="utf-8") as fh:
              json.dump(people, fh, indent=1)
          print("active humans:", len(people))
          print("with an email:", sum(1 for p in people if p["email"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: roster
          path: roster.json
          retention-days: 1
